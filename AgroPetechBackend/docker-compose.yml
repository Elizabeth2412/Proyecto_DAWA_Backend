services:
  minio:
    image: minio/minio
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    volumes:
      - C:/minio-data:/data
    command: server /data --console-address ":9001"
    
  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      mc alias set local http://minio:9000 admin admin123;
      mc mb -p local/agropetech-storage;
      mc anonymous set download local/agropetech-storage;
      exit 0;
      "